<body>
<header class="site">
  <a class="brand" href="/" title="sne.space — The Open Supernova Catalog"><img src="/assets/img/logo-plain.webp" alt="sne.space" class="brand-logo-ia"><span>Open Supernova Catalog</span></a>

<main>
  <h1>Statistics</h1>
  <p>Catalog census snippets regenerated by <code>webcat</code>:</p>
  <ul id="stats" class="stats"></ul>
  <p>Related tables:</p>
  <ul>
    <li><a href="/statistics/host-galaxies/">Host galaxies</a></li>
    <li><a href="/statistics/sky-locations/">Sky locations</a></li>
    <li><a href="/graveyard/">Graveyard</a> (non-SN)</li>
  </ul>
</main>
<script>
async function load() {
  const base = '/astrocats/astrocats/supernovae/output/html/info-snippets/';
  const keys = [
    ['snecount.html', 'Events in catalog'],
    ['hasphoto.html', 'Events with photometry'],
    ['hasspectra.html', 'Events with spectra'],
    ['photocount.html', 'Photometry points'],
    ['spectracount.html', 'Spectra'],
  ];
  const ul = document.getElementById('stats');
  for (const [file, label] of keys) {
    try {
      const v = await fetch(base + file).then(r => r.text());
      const li = document.createElement('li');
      li.innerHTML = `<strong>${label}:</strong> ${v.trim()}`;
      ul.appendChild(li);
    } catch (e) {}
  }
}
load();
</script>
</body>
