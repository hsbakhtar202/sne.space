<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find duplicates — Open Supernova Catalog</title>
<link rel="stylesheet" href="/assets/ia.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.10.16/css/jquery.dataTables.min.css">
<style>
  main { max-width: 1100px; }
  #dupes { width: 100%; background: #fff; font-size: 0.9rem; }
</style>
</head>
<body>
<header class="site">
  <a class="brand" href="/" title="sne.space — The Open Supernova Catalog"><img src="/assets/img/logo-plain.png" alt="sne.space" class="brand-logo-ia"><span>Open Supernova Catalog</span></a>
  <nav>
    <a href="/">Catalog</a>
    <a href="/about/">About</a>
    <a href="/contribute/">Contribute</a>
    <a href="/download/">Download</a>
    <a href="/contribute/find-duplicates/">Duplicates</a>
    <a href="/contribute/find-conflicts/">Conflicts</a>
  </nav>
</header>
<main>
  <h1>Find duplicates</h1>
  <p>Candidate duplicate pairs from webcat <code>dupes.json</code> (<span id="count">…</span> rows).</p>
  <table id="dupes" class="display compact">
    <thead>
      <tr>
        <th>Name 1</th><th>Name 2</th><th>R.A. 1</th><th>Dec. 1</th>
        <th>R.A. 2</th><th>Dec. 2</th><th>Dist (")</th>
        <th>Δt max (d)</th><th>Δt disc (d)</th>
      </tr>
    </thead>
  </table>
</main>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.10.16/js/jquery.dataTables.min.js"></script>
<script>
jQuery(function ($) {
  $.getJSON('/astrocats/astrocats/supernovae/output/dupes.json', function (data) {
    $('#count').text(data.length.toLocaleString());
    $('#dupes').DataTable({
      data: data,
      pageLength: 50,
      deferRender: true,
      columns: [
        { data: 'name1', render: function (d) {
            return d ? '<a href="/sne/' + encodeURIComponent(d) + '/" target="_blank">' + d + '</a>' : '';
          }},
        { data: 'name2', render: function (d) {
            return d ? '<a href="/sne/' + encodeURIComponent(d) + '/" target="_blank">' + d + '</a>' : '';
          }},
        { data: 'ra1', defaultContent: '' },
        { data: 'dec1', defaultContent: '' },
        { data: 'ra2', defaultContent: '' },
        { data: 'dec2', defaultContent: '' },
        { data: 'distdeg', defaultContent: '' },
        { data: 'maxdiffyear', defaultContent: '' },
        { data: 'discdiffyear', defaultContent: '' }
      ]
    });
  });
});
</script>
</body>
</html>
